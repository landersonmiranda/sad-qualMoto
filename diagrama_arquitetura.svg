<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" width="100%" height="100%" style="background:#f8fafc; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="inputGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="engineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
    <linearGradient id="uiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <!-- Filters & Shadows -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <filter id="nodeShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="40" y="25" width="1020" height="60" rx="12" fill="url(#headerGrad)" filter="url(#cardShadow)"/>
  <text x="70" y="52" fill="#ffffff" font-size="18" font-weight="700" letter-spacing="0.3">QualMoto? SAD &bull; Arquitetura e Fluxo de Apoio à Decisão</text>
  <text x="70" y="70" fill="#94a3b8" font-size="12">Sistema de Apoio à Decisão Multicritério com Engenharia Econômica e Ciclo de Vida</text>
  <rect x="910" y="42" width="125" height="26" rx="6" fill="#334155"/>
  <text x="972" y="59" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle">Full-Stack Cloud</text>

  <!-- ================= LAYER 1: ENTRADAS ================= -->
  <rect x="40" y="105" width="1020" height="150" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="40" y="105" width="1020" height="32" rx="14" fill="url(#inputGrad)"/>
  <path d="M 40 123 L 40 137 L 1060 137 L 1060 123 Z" fill="url(#inputGrad)"/>
  <text x="60" y="126" fill="#0369a1" font-size="12" font-weight="700" letter-spacing="0.5">CAMADA 1: FONTES DE DADOS PÚBLICAS &amp; ENTRADAS DO DECISOR</text>

  <!-- Node 1.1: FIPE -->
  <g filter="url(#nodeShadow)">
    <rect x="65" y="148" width="280" height="90" rx="8" fill="#ffffff" stroke="#bae6fd" stroke-width="1.2"/>
    <rect x="75" y="158" width="28" height="28" rx="6" fill="#e0f2fe"/>
    <text x="89" y="177" font-size="14" text-anchor="middle">📊</text>
    <text x="115" y="172" fill="#0f172a" font-size="13" font-weight="700">Tabela FIPE Oficial</text>
    <text x="115" y="187" fill="#64748b" font-size="11">Preço de mercado das 201 motos</text>
    <text x="75" y="210" fill="#0284c7" font-size="10.5" font-family="monospace">• Taxa histórica de desvalorização anual</text>
    <text x="75" y="225" fill="#0284c7" font-size="10.5" font-family="monospace">• 5 categorias: Street, Trail, Scooter...</text>
  </g>

  <!-- Node 1.2: Inmetro PBEV -->
  <g filter="url(#nodeShadow)">
    <rect x="370" y="148" width="280" height="90" rx="8" fill="#ffffff" stroke="#bae6fd" stroke-width="1.2"/>
    <rect x="380" y="158" width="28" height="28" rx="6" fill="#e0f2fe"/>
    <text x="394" y="177" font-size="14" text-anchor="middle">⛽</text>
    <text x="420" y="172" fill="#0f172a" font-size="13" font-weight="700">Inmetro PBEV &amp; ANP</text>
    <text x="420" y="187" fill="#64748b" font-size="11">Eficiência energética homologada</text>
    <text x="380" y="210" fill="#0284c7" font-size="10.5" font-family="monospace">• Consumo urbano e rodoviário (km/l)</text>
    <text x="380" y="225" fill="#0284c7" font-size="10.5" font-family="monospace">• Preços médios de combustíveis (ANP)</text>
  </g>

  <!-- Node 1.3: Perfil do Decisor -->
  <g filter="url(#nodeShadow)">
    <rect x="675" y="148" width="360" height="90" rx="8" fill="#ffffff" stroke="#bae6fd" stroke-width="1.2"/>
    <rect x="685" y="158" width="28" height="28" rx="6" fill="#e0f2fe"/>
    <text x="699" y="177" font-size="14" text-anchor="middle">👤</text>
    <text x="725" y="172" fill="#0f172a" font-size="13" font-weight="700">Parâmetros &amp; Pesos do Decisor</text>
    <text x="725" y="187" fill="#64748b" font-size="11">Preferências individuais na interface</text>
    <text x="685" y="210" fill="#0284c7" font-size="10.5" font-family="monospace">• Km/mês (200 a 5.000) &amp; Trajeto Urb/Rod</text>
    <text x="685" y="225" fill="#0284c7" font-size="10.5" font-family="monospace">• Orçamento teto &amp; Pesos MCDA (5 critérios)</text>
  </g>

  <!-- Connecting Arrows 1 to 2 -->
  <line x1="205" y1="238" x2="205" y2="280" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <line x1="510" y1="238" x2="510" y2="280" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <line x1="855" y1="238" x2="855" y2="280" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrowBlue)"/>

  <!-- ================= LAYER 2: MOTORES ANALÍTICOS (NESTJS) ================= -->
  <rect x="40" y="285" width="1020" height="235" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="40" y="285" width="1020" height="32" rx="14" fill="url(#engineGrad)"/>
  <path d="M 40 303 L 40 317 L 1060 317 L 1060 303 Z" fill="url(#engineGrad)"/>
  <text x="60" y="306" fill="#6b21a8" font-size="12" font-weight="700" letter-spacing="0.5">CAMADA 2: MOTORES ANALÍTICOS DO SAD (BACK-END NESTJS &amp; LOCAL ENGINE)</text>

  <!-- Node 2.1: TCO -->
  <g filter="url(#nodeShadow)">
    <rect x="65" y="330" width="225" height="170" rx="8" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.2"/>
    <rect x="75" y="340" width="28" height="28" rx="6" fill="#f3e8ff"/>
    <text x="89" y="359" font-size="14" text-anchor="middle">💰</text>
    <text x="115" y="354" fill="#0f172a" font-size="13" font-weight="700">1. Motor TCO</text>
    <text x="115" y="369" fill="#64748b" font-size="11">Custo Total de Propriedade</text>
    <line x1="75" y1="380" x2="275" y2="380" stroke="#f1f5f9" stroke-width="1"/>
    <text x="75" y="400" fill="#7e22ce" font-size="10.5">• Consumo harmônico ponderado</text>
    <text x="75" y="418" fill="#7e22ce" font-size="10.5">• Provisão de manutenção/km</text>
    <text x="75" y="436" fill="#7e22ce" font-size="10.5">• Custos fixos (IPVA + Seguro)</text>
    <text x="75" y="454" fill="#7e22ce" font-size="10.5">• Depreciação mensal FIPE</text>
    <rect x="75" y="468" width="205" height="22" rx="4" fill="#faf5ff"/>
    <text x="177" y="483" fill="#6b21a8" font-size="10" font-weight="700" text-anchor="middle">SAÍDA: TCO Mensal e Custo/Km</text>
  </g>

  <!-- Arrow TCO to TOPSIS -->
  <line x1="290" y1="415" x2="310" y2="415" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrowPurple)"/>

  <!-- Node 2.2: TOPSIS -->
  <g filter="url(#nodeShadow)">
    <rect x="315" y="330" width="245" height="170" rx="8" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.2"/>
    <rect x="325" y="340" width="28" height="28" rx="6" fill="#f3e8ff"/>
    <text x="339" y="359" font-size="14" text-anchor="middle">📐</text>
    <text x="365" y="354" fill="#0f172a" font-size="13" font-weight="700">2. Motor TOPSIS (MCDA)</text>
    <text x="365" y="369" fill="#64748b" font-size="11">Classificação Multicritério</text>
    <line x1="325" y1="380" x2="545" y2="380" stroke="#f1f5f9" stroke-width="1"/>
    <text x="325" y="400" fill="#7e22ce" font-size="10.5">• Normalização vetorial euclidiana</text>
    <text x="325" y="418" fill="#7e22ce" font-size="10.5">• Ponderação dinâmica de pesos</text>
    <text x="325" y="436" fill="#7e22ce" font-size="10.5">• Distâncias aos ideais A+ e A-</text>
    <text x="325" y="454" fill="#7e22ce" font-size="10.5">• Score de proximidade relativa (Ci)</text>
    <rect x="325" y="468" width="225" height="22" rx="4" fill="#faf5ff"/>
    <text x="437" y="483" fill="#6b21a8" font-size="10" font-weight="700" text-anchor="middle">SAÍDA: Ranking Ordenado (Ci)</text>
  </g>

  <!-- Arrow TOPSIS to Cluster -->
  <line x1="560" y1="415" x2="578" y2="415" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrowPurple)"/>

  <!-- Node 2.3: Clusterização -->
  <g filter="url(#nodeShadow)">
    <rect x="583" y="330" width="225" height="170" rx="8" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.2"/>
    <rect x="593" y="340" width="28" height="28" rx="6" fill="#f3e8ff"/>
    <text x="607" y="359" font-size="14" text-anchor="middle">🎯</text>
    <text x="633" y="354" fill="#0f172a" font-size="13" font-weight="700">3. Clusterização</text>
    <text x="633" y="369" fill="#64748b" font-size="11">5 Grupos Estratégicos</text>
    <line x1="593" y1="380" x2="793" y2="380" stroke="#f1f5f9" stroke-width="1"/>
    <text x="593" y="400" fill="#7e22ce" font-size="10.5">• Econômicas &amp; Baixo Custo</text>
    <text x="593" y="418" fill="#7e22ce" font-size="10.5">• Uso Misto &amp; Trail | Scooters</text>
    <text x="593" y="436" fill="#7e22ce" font-size="10.5">• Alta Liquidez | Alta Cilindrada</text>
    <text x="593" y="454" fill="#7e22ce" font-size="10.5">• Cálculo de Aderência (FitScore)</text>
    <rect x="593" y="468" width="205" height="22" rx="4" fill="#faf5ff"/>
    <text x="695" y="483" fill="#6b21a8" font-size="10" font-weight="700" text-anchor="middle">SAÍDA: Grupo Recomendado</text>
  </g>

  <!-- Arrow Cluster to Regressao -->
  <line x1="808" y1="415" x2="826" y2="415" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrowPurple)"/>

  <!-- Node 2.4: Regressão Temporal -->
  <g filter="url(#nodeShadow)">
    <rect x="831" y="330" width="205" height="170" rx="8" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.2"/>
    <rect x="841" y="340" width="28" height="28" rx="6" fill="#f3e8ff"/>
    <text x="855" y="359" font-size="14" text-anchor="middle">📈</text>
    <text x="881" y="354" fill="#0f172a" font-size="13" font-weight="700">4. Regressão</text>
    <text x="881" y="369" fill="#64748b" font-size="11">Ciclo de Vida (5 anos)</text>
    <line x1="841" y1="380" x2="1021" y2="380" stroke="#f1f5f9" stroke-width="1"/>
    <text x="841" y="400" fill="#7e22ce" font-size="10.5">• V(t) = V0 * (1 - d)^t (FIPE)</text>
    <text x="841" y="418" fill="#7e22ce" font-size="10.5">• Maint(t) com fator garantia</text>
    <text x="841" y="436" fill="#7e22ce" font-size="10.5">• Detector de Inflexão M &gt; Dep</text>
    <text x="841" y="454" fill="#7e22ce" font-size="10.5">• Manter vs. Substituir</text>
    <rect x="841" y="468" width="185" height="22" rx="4" fill="#faf5ff"/>
    <text x="933" y="483" fill="#6b21a8" font-size="10" font-weight="700" text-anchor="middle">SAÍDA: Ponto Ótimo de Troca</text>
  </g>

  <!-- Connecting Arrows 2 to 3 -->
  <line x1="550" y1="520" x2="550" y2="555" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- ================= LAYER 3: INTERFACE E RESULTADOS (REACT) ================= -->
  <rect x="40" y="560" width="1020" height="135" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="40" y="560" width="1020" height="32" rx="14" fill="url(#uiGrad)"/>
  <path d="M 40 578 L 40 592 L 1060 592 L 1060 578 Z" fill="url(#uiGrad)"/>
  <text x="60" y="581" fill="#065f46" font-size="12" font-weight="700" letter-spacing="0.5">CAMADA 3: APOIO PRESCRITIVO À DECISÃO (INTERFACE CLIENTE REACT / VERCEL)</text>

  <!-- Node 3.1: Dashboard -->
  <g filter="url(#nodeShadow)">
    <rect x="65" y="605" width="225" height="75" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/>
    <text x="80" y="628" fill="#065f46" font-size="12" font-weight="700">Dashboard Gerencial</text>
    <text x="80" y="646" fill="#64748b" font-size="10.5">• KPIs gerais de mercado</text>
    <text x="80" y="662" fill="#64748b" font-size="10.5">• Card do grupo recomendado</text>
  </g>

  <!-- Node 3.2: Base Veiculos -->
  <g filter="url(#nodeShadow)">
    <rect x="315" y="605" width="225" height="75" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/>
    <text x="330" y="628" fill="#065f46" font-size="12" font-weight="700">Base de Motocicletas</text>
    <text x="330" y="646" fill="#64748b" font-size="10.5">• Auditoria dos 201 modelos</text>
    <text x="330" y="662" fill="#64748b" font-size="10.5">• Consumo Inmetro e FIPE oficial</text>
  </g>

  <!-- Node 3.3: Simulacao What-If -->
  <g filter="url(#nodeShadow)">
    <rect x="565" y="605" width="245" height="75" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/>
    <text x="580" y="628" fill="#065f46" font-size="12" font-weight="700">Simulação What-If</text>
    <text x="580" y="646" fill="#64748b" font-size="10.5">• Filtro de estilos (Trail, Custom...)</text>
    <text x="580" y="662" fill="#64748b" font-size="10.5">• Sliders com recálculo instantâneo</text>
  </g>

  <!-- Node 3.4: Relatorio PDF -->
  <g filter="url(#nodeShadow)">
    <rect x="835" y="605" width="200" height="75" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/>
    <text x="850" y="628" fill="#065f46" font-size="12" font-weight="700">Laudo Técnico Executivo</text>
    <text x="850" y="646" fill="#64748b" font-size="10.5">• Parecer de viabilidade</text>
    <text x="850" y="662" fill="#64748b" font-size="10.5">• Botão Imprimir / Exportar PDF</text>
  </g>

  <!-- ================= FOOTER: INFRASTRUCTURE ================= -->
  <rect x="40" y="710" width="1020" height="45" rx="8" fill="url(#cloudGrad)" stroke="#fde68a" stroke-width="1"/>
  <text x="60" y="737" font-size="15">☁️</text>
  <text x="85" y="737" fill="#92400e" font-size="11.5" font-weight="700">Infraestrutura em Nuvem:</text>
  <text x="245" y="737" fill="#78350f" font-size="11">Front-End SPA na <tspan font-weight="700">Vercel</tspan> (https://sad-qual-moto.vercel.app)</text>
  <text x="600" y="737" fill="#92400e" font-size="11">&bull;</text>
  <text x="620" y="737" fill="#78350f" font-size="11">Back-End NestJS REST API no <tspan font-weight="700">Render</tspan> (https://sad-qualmoto.onrender.com)</text>
</svg>
